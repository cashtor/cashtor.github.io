<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pruebas de Cashtor</title>
<style>
  /* Los colores de la aplicación, como en la guía. */
  :root {
    color-scheme: light dark;
    --fondo: #F4EDE4; --tarjeta: #FFFFFF; --texto: #0A1209; --suave: #55604F;
    --borde: #E0D6C8; --verde: #20503A; --sobre-verde: #F4EDE4; --rojo: #A3382C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #16241B; --tarjeta: #1E3126; --texto: #EDE6DC; --suave: #A9B8A9;
      --borde: #2C4534; --verde: #6FA873; --sobre-verde: #12211A; --rojo: #F2B8B5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fondo); color: var(--texto); line-height: 1.5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    background: var(--verde); color: var(--sobre-verde);
    padding: 28px 20px 20px; text-align: center;
  }
  header h1 { font-size: 1.4rem; margin: 0 0 4px; }
  header p { margin: 0; opacity: .85; font-size: .9rem; }
  .envoltorio { max-width: 720px; margin: 0 auto; padding: 0 16px 64px; }

  /* La barra de progreso, pegada arriba: es lo que da sensación de avance. */
  .progreso {
    position: sticky; top: 0; z-index: 5;
    background: var(--fondo); border-bottom: 1px solid var(--borde);
    padding: 12px 16px;
  }
  .progreso .cifra { font-size: .9rem; color: var(--suave); margin-bottom: 6px; }
  .barra { height: 8px; background: var(--borde); border-radius: 99px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--verde); width: 0; transition: width .2s; }

  h2 {
    font-size: 1.05rem; margin: 28px 0 10px; color: var(--verde);
    display: flex; align-items: baseline; gap: 8px;
  }
  h2 small { font-weight: 400; color: var(--suave); font-size: .8rem; }

  label {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
    cursor: pointer;
  }
  label:has(input:checked) { opacity: .5; }
  label:has(input:checked) .hacer { text-decoration: line-through; }
  input[type=checkbox] { width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: var(--verde); }
  .num { font-size: .72rem; color: var(--suave); font-variant-numeric: tabular-nums; }
  .hacer { font-weight: 600; }
  .esperar { color: var(--suave); font-size: .88rem; margin-top: 2px; }
  code { background: var(--fondo); border: 1px solid var(--borde); border-radius: 5px; padding: 0 4px; font-size: .9em; }

  .pie { margin-top: 32px; text-align: center; }
  button {
    font: inherit; cursor: pointer; padding: 10px 16px; border-radius: 10px;
    background: transparent; color: var(--rojo); border: 1px solid var(--borde);
  }
  .nota { color: var(--suave); font-size: .82rem; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Pruebas de Cashtor</h1>
  <p>143 comprobaciones, en diez días</p>
</header>

<div class="progreso">
  <div class="cifra" id="cifra">Cargando…</div>
  <div class="barra"><i id="barra"></i></div>
</div>

<div class="envoltorio">
  <div id="lista"></div>
  <div class="pie">
    <button id="limpiar">Empezar de cero</button>
    <p class="nota">
      Lo marcado se guarda en este navegador y en este aparato. Si abres la
      página en otro móvil, empieza en blanco.
    </p>
  </div>
</div>

ong>","e":"Explica para qué sirve y pide confirmar"},{"id":"10.18","h":"Cambiarla y esperar a la copia del día siguiente","e":"Sigue guardándose (Ajustes → Copia automática, en verde)"},{"dia":"En Windows · solo lo que cambia"},{"id":"W.1","h":"Abrir Cashtor en Windows","e":"Las pestañas van en una <strong>barra lateral</strong>, no abajo"},{"id":"W.2","h":"Mirar Añadir con la ventana ancha","e":"<strong>Dos columnas</strong>: el formulario y la lista de hoy al lado"},{"id":"W.3","h":"Estrechar la ventana hasta el ancho de un móvil","e":"Cambia al diseño de una columna <strong>sin romperse ni solaparse</strong>"},{"id":"W.4","h":"Revisión → importar el extracto → elegir archivo","e":"Abre el selector de archivos <strong>de Windows</strong> y lee el archivo"},{"id":"W.5","h":"Ajustes → Copia → Excel, y Descargar la copia completa","e":"Abre el diálogo de guardar de Windows y el archivo se abre bien"},{"id":"W.6","h":"Cerrar la aplicación y volver a abrirla","e":"Pide <strong>Windows Hello</strong> (o deja pasar, si no lo tienes configurado)"},{"dia":"Al terminar · las comprobaciones finales"}];
const CLAVE = 'cashtor-pruebas-1.8.0';

// **Se guarda en el propio navegador**, no en ningún servidor: es una lista
// de tareas de una persona, no un dato de la aplicación. Envuelto en
// try/catch porque en una ventana privada el almacenamiento puede fallar,
// y entonces la página tiene que seguir funcionando igual (sin recordar).
function leer() {
  try { return new Set(JSON.parse(localStorage.getItem(CLAVE) || '[]')); }
  catch (e) { return new Set(); }
}
function guardar(s) {
  try { localStorage.setItem(CLAVE, JSON.stringify([...s])); } catch (e) {}
}

const hechas = leer();
const lista = document.getElementById('lista');
let total = 0;

for (const b of DATOS) {
  if (b.dia) {
    const h = document.createElement('h2');
    h.textContent = b.dia;
    lista.appendChild(h);
    continue;
  }
  total++;
  const l = document.createElement('label');
  l.innerHTML =
    '<input type="checkbox" data-id="' + b.id + '">' +
    '<span><span class="num">' + b.id + '</span><br>' +
    '<span class="hacer">' + b.h + '</span>' +
    '<div class="esperar">' + b.e + '</div></span>';
  const c = l.querySelector('input');
  c.checked = hechas.has(b.id);
  c.addEventListener('change', () => {
    c.checked ? hechas.add(b.id) : hechas.delete(b.id);
    guardar(hechas);
    pintar();
  });
  lista.appendChild(l);
}

function pintar() {
  const n = [...hechas].length;
  document.getElementById('cifra').textContent =
    n + ' de ' + total + ' comprobadas' + (n === total ? ' — ¡todo listo!' : '');
  document.getElementById('barra').style.width = (total ? n / total * 100 : 0) + '%';
}

document.getElementById('limpiar').addEventListener('click', () => {
  if (!confirm('¿Desmarcar las ' + [...hechas].length + ' comprobaciones marcadas?')) return;
  hechas.clear();
  guardar(hechas);
  document.querySelectorAll('input[type=checkbox]').forEach(c => c.checked = false);
  pintar();
});

pintar();
</script>
